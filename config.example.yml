telegram:
  api_id: 12345678
  api_hash: "replace_me"
  session: "tg_monitor"
  # Необязательно: канал, куда публиковать обработанные посты.
  # Бот/аккаунт должен иметь право публикации.
  destination: null

llm:
  api_key: "replace_me"
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"
  vision_model: null
  temperature: 0.3
  max_tokens: 1800

gigachat:
  enabled: false
  authorization_key: "replace_me"
  scope: "GIGACHAT_API_PERS" # либо GIGACHAT_API_B2B / GIGACHAT_API_CORP
  model: "GigaChat"
  base_url: "https://api.giga.chat/v1"
  oauth_url: "https://ngw.devices.sberbank.ru:9443/api/v2/oauth"
  verify_ssl: true
  ca_bundle_file: null # путь к CA bundle НУЦ Минцифры, если он нужен

analysis:
  enabled: true
  # Сравнивать с опубликованными постами за последние N часов.
  history_hours: 24

storage:
  database: "state.db"
  output_dir: "output"
  # Суммарный лимит всех вложений одного поста/альбома.
  max_post_download_mb: 100

sources:
  - chat: "https://t.me/example_channel"
    enabled: true
    prompt_addition: "Сохраняй деловой тон и все важные числовые данные."
  - chat: "@another_public_channel"
    enabled: false
    prompt_addition: "Сделай текст короче, не более трех абзацев."
